name: focus_blocks
description: Time-blocking that rewards showing up. Plan your day in blocks, then just show up.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.4
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# App icon for Android, iPhone and Mac: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: "assets/icon/icon_android.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 24
  macos:
    generate: true
    image_path: "assets/icon/icon_macos.png"

flutter:
  uses-material-design: true
